<!DOCTYPE html>
<html>
<head>

    <title>AI Diet Planner</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f7fb;
            margin:0;
            padding:0;
        }

        .container{
            width:90%;
            max-width:500px;
            margin:60px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 4px 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#0f62fe;
        }

        input, select{
            width:100%;
            padding:12px;
            margin-top:15px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            border:none;
            background:#0f62fe;
            color:white;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#0043ce;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Diet Planner</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="number" name="age" placeholder="Enter Age" required>

            <input type="number" step="0.1" name="weight" placeholder="Enter Weight (kg)" required>

            <input type="number" step="0.1" name="height" placeholder="Enter Height (cm)" required>

            <select name="diet">

                <option value="veg">Vegetarian</option>

                <option value="nonveg">Non Vegetarian</option>

            </select>

            <button type="submit">Generate Diet Plan</button>

        </form>

    </div>

</body>
</html>
