<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Diet Planner</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f3f7ff;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:500px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            color:#2563eb;
        }

        p{
            text-align:center;
            margin-bottom:30px;
            color:#666;
        }

        form{
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        input,
        select{
            width:100%;
            padding:14px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:10px;
            outline:none;
            background:white;
            color:black;
        }

        input:focus,
        select:focus{
            border-color:#2563eb;
        }

        button{
            padding:14px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#1e4fd1;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Diet Planner</h1>

        <p>Personalized calorie and protein based meal planning</p>

        <form method="POST">

            {% csrf_token %}

            <input
                type="number"
                name="age"
                placeholder="Enter your age"
                required
            >

            <input
                type="number"
                step="0.1"
                name="weight"
                placeholder="Enter your weight in kg"
                required
            >

            <input
                type="number"
                step="0.1"
                name="height"
                placeholder="Enter your height in cm"
                required
            >

            <select name="diet">

                <option value="veg">
                    Vegetarian
                </option>

                <option value="nonveg">
                    Non Vegetarian
                </option>

            </select>

            <button type="submit">
                Generate Diet Plan
            </button>

        </form>

    </div>

</body>

</html>
