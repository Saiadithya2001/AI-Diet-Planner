<!DOCTYPE html>
<html>

<head>

    <title>AI Diet Planner</title>

    <style>

        body{
            background:#f2f2f2;
            font-family:Arial;
            padding:40px;
        }

        .container{
            background:white;
            width:400px;
            margin:auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:#4CAF50;
        }

        input, select{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>AI Diet Planner</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Age</label>
        <input type="number" name="age" required>

        <label>Weight (kg)</label>
        <input type="number" step="0.1" name="weight" required>

        <label>Height (cm)</label>
        <input type="number" step="0.1" name="height" required>

        <label>Diet Preference</label>

        <select name="diet" required>
            <option value="Veg">Veg</option>
            <option value="Non-Veg">Non-Veg</option>
        </select>

        <button type="submit">Generate Plan</button>

    </form>

</div>

</body>
</html>
