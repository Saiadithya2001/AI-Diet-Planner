<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diet Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f7f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #444441;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e8e8e2;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
    }
    .logo {
      display: flex; align-items: center; gap: 0.6rem;
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem; color: #444441;
      margin-bottom: 0.4rem;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: #1D9E75; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg {
      width: 20px; height: 20px;
      stroke: #fff; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .subtitle { font-size: 0.88rem; color: #888780; margin-bottom: 2rem; }
    label {
      display: block;
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: #888780;
      margin-bottom: 0.4rem; margin-top: 1.2rem;
    }
    input, select {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #e8e8e2;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #444441;
      background: #fff;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: #1D9E75; }
    .btn {
      margin-top: 1.8rem; width: 100%;
      padding: 0.8rem;
      background: #1D9E75; color: #fff;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #17845f; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
    </div>
    Diet Planner
  </div>
  <p class="subtitle">Get your personalised daily meal plan</p>

  <form method="POST" action="/">
    {% csrf_token %}

    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="10" max="100" placeholder="e.g. 25" required />

    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" name="weight" step="0.1" min="20" max="300" placeholder="e.g. 70" required />

    <label for="height">Height (cm)</label>
    <input type="number" id="height" name="height" step="0.1" min="100" max="250" placeholder="e.g. 175" required />

    <label for="diet">Diet Preference</label>
    <select id="diet" name="diet" required>
      <option value="" disabled selected>Select diet type</option>
      <option value="veg">Vegetarian</option>
      <option value="nonveg">Non-Vegetarian</option>
    </select>

    <button type="submit" class="btn">Generate My Plan →</button>
  </form>
</div>
</body>
</html>
